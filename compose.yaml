name: citypulse

x-api-common: &api-common
  build:
    context: ./apps/api
  env_file:
    - ${CITYPULSE_ENV_FILE:-.env}
  volumes:
    - uploads:/app/var/uploads
  restart: unless-stopped

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *api-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["tools"]

  api:
    <<: *api-common
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20

  worker:
    <<: *api-common
    command: ["celery", "-A", "citypulse.worker:celery_app", "worker", "--loglevel=INFO"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    <<: *api-common
    command: ["celery", "-A", "citypulse.worker:celery_app", "beat", "--loglevel=INFO", "--schedule=/tmp/citypulse-celerybeat-schedule"]
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: ./apps/web
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/web-health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${CITYPULSE_HTTP_PORT:-8080}:80"
    volumes:
      - ./infra/proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped

  backup:
    <<: *api-common
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "citypulse backup scheduler started (interval: $${CITYPULSE_BACKUP_INTERVAL_SECONDS:-86400}s)"
        while true; do
          sleep "$${CITYPULSE_BACKUP_INTERVAL_SECONDS:-86400}"
          /app/scripts/backup.sh /app/var/backups || echo "backup failed at $$(date -Iseconds)"
        done
    volumes:
      - uploads:/app/var/uploads
      - ./scripts:/app/scripts:ro
      - backups:/app/var/backups
    depends_on:
      postgres:
        condition: service_healthy
    profiles: ["backup"]

volumes:
  postgres_data:
  redis_data:
  uploads:
  backups:
