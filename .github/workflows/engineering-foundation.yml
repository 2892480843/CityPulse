name: Engineering foundation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/pyproject.toml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - name: Install API dependencies
        run: python -m pip install -e 'apps/api[dev]'

      - name: Lint and test API
        run: |
          ruff check apps/api/src apps/api/tests apps/api/migrations
          pytest apps/api/tests -q

      - name: Install, test, type-check, and build Web
        run: |
          npm --prefix apps/web ci
          npm --prefix apps/web test
          npm --prefix apps/web run typecheck
          npm --prefix apps/web run build

      - name: Validate Compose model
        env:
          CITYPULSE_ENV_FILE: .env.example
        run: docker compose --env-file .env.example config --quiet

      - name: Run Linux container smoke test
        run: ./scripts/smoke-compose.sh
